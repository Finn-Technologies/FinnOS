# FinnOS A/B OTA boot-counting and automatic rollback snippet for GRUB2.
# Reference template installed into /etc/grub.d/09_finnos_ab on A/B installs.
#
# Variables persisted in /boot/grub/grubenv:
#   finn_active_slot   = a | b        (last committed known-good slot)
#   finn_pending_slot  = "" | a | b   (trial slot armed by finn-update apply)
#   finn_tries_left    = 0..3         (remaining trial boot attempts)

if [ -s $prefix/grubenv ]; then
    load_env
fi

if [ -z "$finn_active_slot" ]; then
    set finn_active_slot="a"
fi

set finn_boot_slot="$finn_active_slot"

if [ -n "$finn_pending_slot" ]; then
    if [ "$finn_tries_left" = "3" ]; then
        set finn_tries_left="2"
        set finn_boot_slot="$finn_pending_slot"
        save_env finn_tries_left
    elif [ "$finn_tries_left" = "2" ]; then
        set finn_tries_left="1"
        set finn_boot_slot="$finn_pending_slot"
        save_env finn_tries_left
    elif [ "$finn_tries_left" = "1" ]; then
        set finn_tries_left="0"
        set finn_boot_slot="$finn_pending_slot"
        save_env finn_tries_left
    else
        # All trial boot attempts were exhausted without finn-boot-health
        # committing the pending slot: fall back automatically to active_slot.
        set finn_pending_slot=""
        set finn_tries_left="0"
        set finn_boot_slot="$finn_active_slot"
        save_env finn_pending_slot finn_tries_left
    fi
fi

if [ "$finn_boot_slot" = "b" ]; then
    set default="finnos-slot-b"
else
    set default="finnos-slot-a"
fi

menuentry "FinnOS (Slot A)" --id finnos-slot-a {
    search --no-floppy --label --set=root FINNOS_A
    linux /boot/vmlinuz root=PARTLABEL=FINNOS_A rw finn.slot=a quiet splash vt.global_cursor_default=0 plymouth.ignore-serial-consoles loglevel=3
    initrd /boot/initramfs.img
}

menuentry "FinnOS (Slot B)" --id finnos-slot-b {
    search --no-floppy --label --set=root FINNOS_B
    linux /boot/vmlinuz root=PARTLABEL=FINNOS_B rw finn.slot=b quiet splash vt.global_cursor_default=0 plymouth.ignore-serial-consoles loglevel=3
    initrd /boot/initramfs.img
}
