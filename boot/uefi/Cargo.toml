[package]
name = "finn-boot-uefi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "FinnOS x86-64 UEFI boot manager and host-testable ELF validation."

[features]
default = []
uefi-app = ["dep:uefi"]

[dependencies]
finn-boot-protocol = { path = "../protocol" }
uefi = { version = "0.34", optional = true, features = ["alloc", "global_allocator", "panic_handler"] }

[[bin]]
name = "finn-boot-x86_64"
path = "src/main.rs"
required-features = ["uefi-app"]
test = false
bench = false

[lints]
workspace = true
