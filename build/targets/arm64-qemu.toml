name = "arm64-qemu"
architecture = "arm64"
platform = "qemu"
firmware = "uefi"
status = "serial-entry-r4.4-gicv2-local"
bootable = true
kernel_package = "finn-kernel"
kernel_binary = "finn-kernel-aarch64"
kernel_cargo_target = "aarch64-unknown-none"
boot_package = "finn-boot-uefi"
boot_binary = "finn-boot"
boot_cargo_target = "aarch64-unknown-uefi"
boot_filename = "BOOTAA64.EFI"
kernel_filename = "KERNEL.ELF"
image_filename = "finnos-arm64-uefi.img"
qemu_system = "qemu-system-aarch64"
qemu_machine = "virt,gic-version=2,secure=off"
qemu_cpu = "cortex-a72"
note = "R3 serial entry is integrated; local R4.1-R4.4 adds exceptions, early memory, owned MMU, and a pinned single-BSP GICv2 self-SGI path. Generic timer, tasks, and external routing remain R4 work."
