<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="flBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="52%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="flCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="16" ry="16" fill="url(#flBg)"/>
  <!-- Layered 6-petal blossoming flower -->
  <g transform="translate(32 32)">
    <ellipse cx="0" cy="-12.5" rx="6.6" ry="11.2" fill="#FFFFFF" fill-opacity="0.96"/>
    <ellipse cx="0" cy="-12.5" rx="6.6" ry="11.2" fill="#FFFFFF" fill-opacity="0.88" transform="rotate(60)"/>
    <ellipse cx="0" cy="-12.5" rx="6.6" ry="11.2" fill="#FFFFFF" fill-opacity="0.96" transform="rotate(120)"/>
    <ellipse cx="0" cy="-12.5" rx="6.6" ry="11.2" fill="#FFFFFF" fill-opacity="0.88" transform="rotate(180)"/>
    <ellipse cx="0" cy="-12.5" rx="6.6" ry="11.2" fill="#FFFFFF" fill-opacity="0.96" transform="rotate(240)"/>
    <ellipse cx="0" cy="-12.5" rx="6.6" ry="11.2" fill="#FFFFFF" fill-opacity="0.88" transform="rotate(300)"/>
    <!-- Inner golden-amber blossom center -->
    <circle cx="0" cy="0" r="7.4" fill="url(#flCore)"/>
    <circle cx="-1.6" cy="-1.6" r="2.2" fill="#FFFFFF" fill-opacity="0.55"/>
  </g>
</svg>
