# The FinnOS boot splash. Plymouth reads this from the initramfs and again
# from the installed root; both copies are installed from base/, so a machine
# and the disc cannot end up with different boot marks.
#
# ShowDelay=0 is the point: the mark appears as soon as Plymouth starts, not
# after a wait that would leave the blinking text cursor visible first.
[Daemon]
Theme=finnos
ShowDelay=0
