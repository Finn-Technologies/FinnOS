# mkinitcpio configuration — the live medium's, not an installed machine's.
#
# This file is in airootfs, so it is the one the ISO's initramfs is built
# with. The archiso hooks are what make the disc's root findable: without
# them the kernel boots and stops, because the root filesystem it would
# look for is a squashfs inside the ISO and not a partition.
#
# The KMS hooks are the other half. finn-comp drives the display through
# DRM/KMS, and the modesetting driver has to be in the initramfs for the
# console to come up before userspace does — a machine that shows nothing
# until plymouth-sized machinery loads is a machine that looks broken.
#
# A kernel on an installed machine gets its own file from the linux
# package; this one never leaves the disc.

MODULES=()
BINARIES=()
FILES=()

HOOKS=(base udev modconf kms memdisk archiso archiso_loop_mnt block filesystems keyboard)

COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19 --long=27)
MODULES_DECOMPRESS="yes"
