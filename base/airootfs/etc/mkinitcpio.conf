# mkinitcpio configuration — the live medium's, not an installed machine's.
#
# This file is in airootfs, so it is the one the ISO's initramfs is built
# with. The archiso hooks are what make the disc's root findable: without
# them the kernel boots and stops, because the root filesystem it would
# look for is a squashfs inside the ISO and not a partition.
#
# KMS comes before Plymouth so the mark is drawn on the native-resolution
# framebuffer instead of a firmware-sized one. Plymouth then owns the display
# from the initramfs until the compositor takes it: there is no text console
# phase in which a blinking cursor could appear. The installed machine has
# its own copy under base/installed/etc/mkinitcpio.conf; neither leaves this
# tree.
#
# This one never leaves the disc. An installed machine gets the separate
# base/installed/etc/mkinitcpio.conf, which boots from a partition and has
# no archiso hooks.

MODULES=()
BINARIES=()
# Plymouth starts before / is mounted. A theme that only lives on the disc
# is a theme nobody ever sees, so the config, the theme descriptor, the
# script and the mark are carried inside the initramfs.
FILES=(/etc/plymouth/plymouthd.conf
       /usr/share/plymouth/themes/finnos/finnos.plymouth
       /usr/share/plymouth/themes/finnos/finnos.script
       /usr/share/plymouth/themes/finnos/mark.png
       /usr/share/plymouth/themes/finnos/bar-track.png
       /usr/share/plymouth/themes/finnos/bar-fill.png
       /usr/share/plymouth/themes/finnos/bar-cap-l.png
       /usr/share/plymouth/themes/finnos/bar-cap-r.png)

HOOKS=(base udev modconf kms plymouth memdisk archiso archiso_loop_mnt block filesystems keyboard)

COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19 --long=27)
MODULES_DECOMPRESS="yes"
