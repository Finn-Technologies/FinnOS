# The installed machine's initramfs. The live medium has its own copy under
# base/airootfs/etc/mkinitcpio.conf; this one boots from a partition, so it
# carries no archiso hooks and does not need the squashfs loop mount.
#
# The one addition to the package's defaults is Plymouth, placed after KMS
# and at the end of HOOKS so the Finn mark stays on the framebuffer until
# switch_root. The theme files are carried in the image for the same reason
# they are on the disc: Plymouth starts before / is mounted. Both this file
# and the theme are installed by base/setup.sh and vm/finn-chroot.sh, so a
# machine and the medium show the same mark.

# virtio_gpu gives Plymouth a DRM renderer in the QEMU dev VM. Without a
# renderer it falls back to the text theme, which quiet then hides entirely.
# On a machine with a real GPU this module is simply unused.
MODULES=(virtio_gpu)
BINARIES=()
FILES=(/etc/plymouth/plymouthd.conf
       /usr/share/plymouth/themes/finnos/finnos.plymouth
       /usr/share/plymouth/themes/finnos/finnos.script
       /usr/share/plymouth/themes/finnos/mark.png
       /usr/share/plymouth/themes/finnos/bar-track.png
       /usr/share/plymouth/themes/finnos/bar-fill.png
       /usr/share/plymouth/themes/finnos/bar-cap-l.png
       /usr/share/plymouth/themes/finnos/bar-cap-r.png)

HOOKS=(base udev autodetect modconf kms block filesystems fsck keyboard plymouth)

COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19 --long=27)
MODULES_DECOMPRESS="yes"
