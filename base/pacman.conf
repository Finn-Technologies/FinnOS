#
# FinnOS pacman configuration.
#
# This is the configuration the disc boots with and the one setup.sh puts
# on a machine. It is Arch's file with the desktop removed.
#
# IgnorePkg is the guard rail that keeps the second display stack out of
# the image. It is a guard rail and not a sandbox. An ignored package is
# not installed, not even as a dependency: pacman logs "ignoring package
# ..." and fails the transaction if nothing else can satisfy the
# dependency. Two things get past it, and both are intended: naming the
# package on the command line installs it after a warning, and a package
# installed from a file with -U never consults the list at all.
#
# The list excludes competing display servers and compositors, not the
# Wayland libraries and protocols used by applications. finn-comp owns the
# display and hosts Wayland clients; Xwayland is permitted as a client bridge,
# not as an alternate display manager.
#
# The rule the list enforces is the product's: FinnOS has one display
# server, and it is finn-comp.
#
# Keep this list alphabetical so that a duplicate is visible.
#
[options]
RootDir     = /
DBPath      = /var/lib/pacman/
CacheDir    = /var/cache/pacman/pkg/
LogFile     = /var/log/pacman.log
GPGDir      = /etc/pacman.d/gnupg/
HookDir     = /etc/pacman.d/hooks/
HoldPkg     = pacman glibc
Architecture = auto

# The servers, toolkits and sessions that are another operating system's
# desktop. Nothing in FinnOS links against them, and nothing on the disc
# needs them.
IgnorePkg   = xorg-server xorg-server-common
IgnorePkg   = weston sway mutter kwin wlroots
IgnorePkg   = gtk2 gtk3 gtk4 gtkmm3
IgnorePkg   = qt5-base qt5-declarative qt5-wayland qt6-base qt6-declarative qt6-wayland
IgnorePkg   = gnome gnome-shell gnome-session gnome-control-center
IgnorePkg   = plasma plasma-desktop plasma-workspace kde-applications
IgnorePkg   = sddm gdm lightdm greetd

# A signature that cannot be checked is not a signature. Both the package
# databases and the packages are signed, and the machine refuses what it
# cannot verify.
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# The live disc has no swap and little RAM; the database is not worth
# keeping in memory for a session that lasts as long as an install.
CheckSpace
ParallelDownloads = 5

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
