# The default boot of the FinnOS install medium: boot the live environment
# and hand the console to the installer.
#
# finn.install is the switch the live root reads: the installer's hook in
# /root/.bash_profile sees it on the kernel command line and starts
# finn-install after ten seconds, which is long enough to press Ctrl-C and
# stay in the shell.
#
# archisobasedir and archisolabel are how the initramfs finds the live
# root, and they name install_dir and iso_label from base/profiledef.sh.

title   Install FinnOS
linux   /finn/boot/x86_64/vmlinuz-linux
initrd  /finn/boot/x86_64/initramfs-linux.img
options archisobasedir=finn archisolabel=FINNOS cow_spacesize=25% finn.install
