# The second boot of the disc: the same live environment, without the
# installer. This is the entry for looking at a machine before erasing it,
# and the one to use when the install has to be driven by hand.

title   FinnOS live shell
linux   /finn/boot/x86_64/vmlinuz-linux
initrd  /finn/boot/x86_64/initramfs-linux.img
options archisobasedir=finn archisolabel=FINNOS cow_spacesize=25% console=ttyS0,115200 console=tty0
