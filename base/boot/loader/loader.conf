# systemd-boot, on the disc's EFI system partition.
#
# Two entries, the same two GRUB and syslinux carry. The order in the entries
# directory is the order on the menu: 01 installs FinnOS, 02 is the way in
# without installing. "default" names the first one, so a machine left alone
# does the thing the disc is for.
#
# There is no speech entry: the image carries no screen reader, so the menu
# does not offer one.
#
# The editor stays off: a menu a passing person can edit into an unbootable
# machine is not a menu, and the disc has no secrets to protect by hiding it.

default 01-finnos-install.conf
timeout 10
editor no
console-mode max
