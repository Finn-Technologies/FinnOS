# The FinnOS install medium under GRUB.
#
# The disc ships three loaders because the machines it ships to are not the
# same machine: syslinux for a BIOS, systemd-boot for UEFI, and GRUB here
# for the firmware that boots neither of them the way it was told to. All
# three menus have the same two entries, in the same order, and none of
# them names anything but FinnOS.
#
# There is no speech entry. The image carries no screen reader, so an entry
# that offered one would be a promise the disc cannot keep.
#
# The kernel lives under install_dir ("finn" in base/profiledef.sh) and the
# disc is found by the label iso_label writes into it, so both are the same
# constants as the profile's, restated where GRUB can read them.

insmod all_video
set gfxmode=auto
set gfxpayload=keep

if [ "$grub_cpu" = "arm64" ]; then
  set finn_arch=aarch64
else
  set finn_arch=x86_64
fi
set finn_basedir=/finn/boot/$finn_arch
set finn_options="archisobasedir=finn archisolabel=FINNOS cow_spacesize=25% console=ttyS0,115200 console=tty0"

search --no-floppy --set=root --label FINNOS

menuentry "Install FinnOS" {
  linux  $finn_basedir/vmlinuz-linux $finn_options finn.install
  initrd $finn_basedir/initramfs-linux.img
}

menuentry "FinnOS live shell" {
  linux  $finn_basedir/vmlinuz-linux $finn_options
  initrd $finn_basedir/initramfs-linux.img
}
