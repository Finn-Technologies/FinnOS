# The install medium's syslinux menu — the BIOS half of the disc.
#
# syslinux reads this file from /boot/syslinux on the ISO; mkarchiso copies
# the directory as it finds it. Two entries, in the order a person wants
# them: the first installs FinnOS, the second leaves you at the prompt.
#
# The kernel and the initramfs are under install_dir, which is "finn" in
# profiledef.sh; the label is iso_label, also from there. If either moves,
# this file moves with it — the disc will not boot off a label it does not
# carry, and it will not find a kernel it does not have.
#
# There is no MENU BACKGROUND: the menu is drawn in the firmware's own
# colours rather than with another distribution's mark on it.

DEFAULT finnos
PROMPT 0
TIMEOUT 100

MENU TITLE FinnOS

LABEL finnos
  MENU LABEL Install FinnOS
  MENU DEFAULT
  LINUX /finn/boot/x86_64/vmlinuz-linux
  INITRD /finn/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=finn archisolabel=FINNOS cow_spacesize=25% finn.install
  TEXT HELP
    Erase the first disk and install FinnOS onto it.
  ENDTEXT

LABEL finnos-shell
  MENU LABEL FinnOS live shell
  LINUX /finn/boot/x86_64/vmlinuz-linux
  INITRD /finn/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=finn archisolabel=FINNOS cow_spacesize=25%
  TEXT HELP
    Stay in the live environment. Run "finn-install" when you are ready.
  ENDTEXT

LABEL finnos-speech
  MENU LABEL FinnOS live shell with speech
  LINUX /finn/boot/x86_64/vmlinuz-linux
  INITRD /finn/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=finn archisolabel=FINNOS cow_spacesize=25% accessibility=on
  TEXT HELP
    The live environment with a screen reader on the console.
  ENDTEXT
