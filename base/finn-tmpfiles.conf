# /run/finn is the FinnOS IPC namespace: wayland-0, comp.sock
# (finn-comp) and the state/* override files live here.
# /tmp/.X11-unix is created world-writable sticky so Xwayland (started by
# root compositor finn-comp) and X11/Wine apps running as finn share X sockets.
#
# It is deliberately created by tmpfiles rather than by a unit's
# RuntimeDirectory, because RuntimeDirectory is removed when *any* unit
# declaring it stops — which would unlink sockets every
# time the compositor restarted.
d /run/finn 0755 root finn -
d /run/finn/state 0755 root finn -
d /tmp/.X11-unix 1777 root root -
