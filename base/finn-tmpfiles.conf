# /run/finn is the FinnOS IPC namespace: control.sock (finnd), comp.sock
# (finn-comp) and the state/* override files live here.
#
# It is deliberately created by tmpfiles rather than by a unit's
# RuntimeDirectory, because RuntimeDirectory is removed when *any* unit
# declaring it stops — which would unlink the control plane's socket every
# time the compositor restarted.
d /run/finn 0755 root finn -
d /run/finn/state 0755 root finn -
