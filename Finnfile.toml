# Experimental preview of the future FinnOS build description.
schema_version = 1

[project]
name = "FinnOS"
status = "foundation"
default_target = "x86_64-qemu"

[targets.x86_64-qemu]
configuration = "build/targets/x86_64-qemu.toml"

[targets.arm64-qemu]
configuration = "build/targets/arm64-qemu.toml"

[profiles.development]
## Cargo's development artifact directory is named `debug`.
cargo_profile = "debug"
optimization = 0
debug_symbols = true
assertions = true

[profiles.release]
cargo_profile = "release"
optimization = 3
debug_symbols = true
assertions = false
