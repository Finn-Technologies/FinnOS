[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "finnsdk"
version = "0.1.0"
description = "FinnSDK — the toolkit for building on FinnOS: the .fui compiler, the control-plane client and the app templates"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "The FinnOS contributors" }]
keywords = ["finnos", "finnui", "compositor", "control-plane"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Operating System",
]

# No dependencies. The SDK has to run on whatever host the agent runs on,
# and a toolkit that needs a wheel to answer a question about a window is a
# toolkit nobody will use.
dependencies = []

[project.optional-dependencies]
# Only the screenshot helper wants a PNG; the capture itself is a PPM.
images = ["pillow>=9"]

[project.scripts]
fuic = "finnsdk.fuic.cli:main"
finn-sdk = "finnsdk.cli:main"

[project.urls]
Homepage = "https://github.com/finnos/finnos"

[tool.setuptools.packages.find]
include = ["finnsdk*"]
