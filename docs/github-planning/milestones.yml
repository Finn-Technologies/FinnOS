milestones:
  - title: "M0 Reproducible Build"
    objective: "Both profiles are deterministic to invoke; loader validation and CI evidence are trustworthy."
    exit: "R1-R2 accepted; x86 debug/release image boots are required checks."
  - title: "M1 Dual-Architecture Boot"
    objective: "x86-64 and ARM64 reach a stable kernel baseline in supported QEMU machines."
    exit: "R3-R4 boot parity, memory, exceptions, timer, diagnostics, and shutdown pass."
  - title: "M2 Core Kernel"
    objective: "Preemptible isolated execution and minimal capability IPC work on both architectures."
    exit: "R6-R8 adversarial tests pass."
  - title: "M3 Userspace Foundation"
    objective: "Init, supervised services, runtime, and diagnostic shell execute in isolation."
    exit: "R9 passes on both architectures."
  - title: "M4 Devices and Storage"
    objective: "Virtual input, block, network, VFS, and persistence validate driver/service contracts."
    exit: "R10-R12 reset, fault, and persistence tests pass."
  - title: "M5 Graphical Stack"
    objective: "Peony software compositor, toolkit, shell, accessibility, and core apps are usable."
    exit: "R13-R14 visual, input, accessibility, and performance gates pass."
  - title: "M6 Developer Preview"
    objective: "External developers can install, recover, and build packaged apps."
    exit: "R15 and preview portion of R16 pass."
  - title: "M7 Beta"
    objective: "Update, security, reliability, accessibility, and hardware qualification gates pass."
    exit: "R16-R18 beta criteria pass."
  - title: "M8 Stable 1.0"
    objective: "Supported, signed, recoverable release with maintenance policy."
    exit: "R19 and RELEASING.md checklist pass."
