name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - run: python3 .agents/scripts/validate.py --all
      - run: cargo build -p finn-kernel --bin finn-kernel-x86_64 --features kernel-bin --target x86_64-unknown-none
      - run: cargo build -p finn-boot-uefi --bin finn-boot-x86_64 --features uefi-app --target x86_64-unknown-uefi

  target-profile-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [development, release]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Build configured target and profile
        run: ./tools/finn build-boot --target x86_64-qemu --profile ${{ matrix.profile }}
