name: CI

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
          targets: x86_64-unknown-none, x86_64-unknown-uefi
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - run: cargo build -p finn-kernel --bin finn-kernel-x86_64 --features kernel-bin --target x86_64-unknown-none
      - run: cargo build -p finn-boot-uefi --bin finn-boot-x86_64 --features uefi-app --target x86_64-unknown-uefi
