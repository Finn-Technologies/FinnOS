name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: the test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: the Python tests
        run: make test
      - name: the C++ unit tests
        run: make test-unit
      - name: the style checks
        run: make lint

  build:
    name: the build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: the dependencies
        run: |
          pacman -Syu --noconfirm --needed git wlroots0.20 wayland \
            wayland-protocols libxkbcommon freetype2 fontconfig libdrm \
            libinput mesa seatd grim
      - name: build
        run: make -j"$(nproc)"
      - name: the runtime tests
        run: make test-unit
      - name: the tree is clean
        run: git diff --exit-code
