name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: the test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: the Python tests
        run: make test
      - name: the C++ unit tests
        run: make test-unit
      - name: the style checks
        run: make lint

  build:
    name: the build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # git goes in before the checkout: without it actions/checkout falls
      # back to a tarball with no .git, and "the tree is clean" has nothing
      # to compare against.
      - name: git
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v4
      - name: the dependencies
        run: |
          pacman -S --noconfirm --needed wlroots0.20 wayland \
            wayland-protocols libxkbcommon freetype2 fontconfig libdrm \
            libinput mesa seatd grim
      - name: build
        run: make -j"$(nproc)"
      - name: the runtime tests
        run: make test-unit
      - name: the tree is clean
        # The checkout belongs to the runner's user and the container runs
        # as root, so git refuses the directory until it is marked safe.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code
