name: ISO image

on:
  workflow_dispatch:
    inputs:
      full_install:
        description: 'Also run the unattended install to a disk (slow)'
        type: boolean
        default: false
  push:
    tags: ['v*']

jobs:
  base:
    name: the base tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the shell scripts parse
        run: |
          bash -n base/mkfinniso base/setup.sh \
            vm/finn-install.sh vm/finn-chroot.sh
          test -x base/mkfinniso
          test -x base/setup.sh
          test -x vm/finn-install.sh
          test -x vm/finn-chroot.sh
      - name: the tree checks out
        # The profile, the boot menus against the profile's label and
        # layout, the package lists, the pacman guard rail, the two copies
        # of the units, and that nothing on the disc names another
        # distribution. It runs anywhere; only the build needs Arch.
        run: |
          base/mkfinniso --check
          base/mkfinniso --check --arch=aarch64
      - name: the two package names are the same list
        run: |
          test -L base/packages.x86
          test -L base/packages.arm
          cmp base/packages.x86 base/packages.x86_64
          cmp base/packages.arm base/packages.aarch64
      - name: the style checks
        # The house linter, on this directory: trailing whitespace, a file
        # that does not end in a newline, and the executable bit. base/ is
        # not in scripts/lint.sh's default paths yet.
        run: |
          scripts/lint.sh base
          ! grep -rIn 'Arch Linux' base/boot base/airootfs/etc/issue base/airootfs/etc/motd
      - name: the boot and package tests
        # The QEMU cases skip themselves without FINNOS_ISO; the profile
        # tests run here with a fake mkarchiso, and the real build below
        # exercises them against the ISO it writes.
        run: python3 -m unittest tests.test_x86_boot -v

  iso:
    name: build and boot the FinnOS install ISO
    needs: base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the tools that check and boot the image
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools mtools qemu-system-x86 ovmf
      - name: build the ISO natively in Arch
        # A GitHub runner is not an Arch machine, so the build runs in a
        # privileged Arch container. base/mkfinniso is the one way to write
        # the disc: it stages the profile (syslinux, efiboot, ISO-only
        # packages) from base/ in this tree and runs mkarchiso itself, so
        # CI builds exactly what a developer builds. No base image is
        # downloaded; the disc is FinnOS throughout.
        run: |
          mkdir -p out
          docker run --privileged --rm \
            -v "$PWD:/build" -w /build archlinux:latest \
            bash -c 'pacman-key --init && pacman-key --populate && \
              pacman -Sy --noconfirm archiso && \
              ./base/mkfinniso /build/out/finnos.iso'
          mv out/finnos.iso finnos.iso
      - name: the disc is bootable
        run: |
          xorriso -indev finnos.iso -report_el_torito plain
      - name: the payload is in the live root
        run: |
          xorriso -osirrox on -indev finnos.iso \
            -extract /finn/x86_64/airootfs.sfs /tmp/airootfs.sfs
          rm -rf /tmp/live
          unsquashfs -q -d /tmp/live /tmp/airootfs.sfs \
            opt/finnos/vm/finn-install.sh \
            opt/finnos/vm/finn-chroot.sh \
            opt/finnos/base/mkfinniso \
            opt/finnos/base/profiledef.sh \
            opt/finnos/base/airootfs/etc/os-release \
            opt/finnos/base/airootfs/etc/systemd/system/finn-comp.service \
            usr/local/bin/finn-install \
            etc/os-release etc/issue etc/motd etc/hostname \
            etc/systemd/system/finn-comp.service etc/systemd/system/finnd.service \
            usr/lib/tmpfiles.d/finn.conf \
            root/.zprofile root/.bash_profile
          # The installer is run, not read, so the mode is part of it.
          test -x /tmp/live/opt/finnos/vm/finn-install.sh
          test -x /tmp/live/opt/finnos/vm/finn-chroot.sh
          test -x /tmp/live/opt/finnos/base/mkfinniso
          test -x /tmp/live/usr/local/bin/finn-install
          # The live shell is what starts the installer, so the hook has to
          # be in the file that shell reads: the live environment's root
          # shell is zsh.
          grep -q 'finn.install' /tmp/live/root/.zprofile
          grep -q 'finn.install' /tmp/live/root/.bash_profile
          # The disc is FinnOS's, not the distribution it was remastered
          # from: what it calls itself at the console is part of that, and
          # so is the installer's own branding and the units. Each of them
          # is the same file the tree carries, so they are compared rather
          # than eyeballed.
          grep -q '^ID=finnos$' /tmp/live/etc/os-release
          for f in etc/os-release etc/issue etc/motd etc/hostname \
                   etc/systemd/system/finn-comp.service \
                   etc/systemd/system/finnd.service \
                   usr/lib/tmpfiles.d/finn.conf \
                   usr/local/bin/finn-install; do
            cmp "/tmp/live/$f" "/tmp/live/opt/finnos/base/airootfs/$f"
          done
          test "$(cat /tmp/live/etc/hostname)" = finnos
      - name: the menus say FinnOS
        run: |
          xorriso -osirrox on -indev finnos.iso \
            -extract /boot/syslinux /tmp/syslinux
          grep -rE 'MENU TITLE FinnOS' /tmp/syslinux
          grep -E 'DEFAULT finnos' /tmp/syslinux/syslinux.cfg
          grep -E 'MENU LABEL Install FinnOS' /tmp/syslinux/syslinux.cfg
          grep -E 'MENU LABEL FinnOS live shell' /tmp/syslinux/syslinux.cfg
          ! grep -rE 'Arch Linux' /tmp/syslinux/*.cfg
          xorriso -osirrox on -indev finnos.iso \
            -extract /loader/entries /tmp/entries
          cat /tmp/entries/01-finnos-install.conf
          grep -E 'title +Install FinnOS' /tmp/entries/01-finnos-install.conf
          grep -E 'finn\.install' /tmp/entries/01-finnos-install.conf
          grep -E 'title +FinnOS live shell' /tmp/entries/02-finnos-live.conf
          ! grep -rE 'Arch Linux' /tmp/entries
      - name: the UEFI menu inside the EFI partition says FinnOS
        # systemd-boot reads /loader from the FAT image in the appended
        # partition, not from the ISO9660 /loader checked above. This is the
        # check the old in-place remaster could not pass.
        run: |
          mkdir -p /tmp/boot-images
          xorriso -osirrox on -indev finnos.iso \
            -extract_boot_images /tmp/boot-images
          efi="$(ls /tmp/boot-images/*efi*.img | head -1)"
          test -n "$efi"
          mtype -i "$efi" ::/loader/entries/01-finnos-install.conf \
            | grep -E 'title +Install FinnOS'
          mtype -i "$efi" ::/loader/entries/01-finnos-install.conf \
            | grep -E 'finn\.install'
          for f in $(mdir -i "$efi" -b ::/loader/entries); do
            if mtype -i "$efi" "::/loader/entries/$f" | grep -q 'Arch Linux'; then
              echo "the EFI menu still names Arch Linux: $f" >&2
              exit 1
            fi
          done
      - name: boot it to the installer under BIOS and UEFI
        env:
          FINNOS_ISO: finnos.iso
          FINNOS_QEMU_TIMEOUT: '900'
        run: python3 -m unittest tests.test_x86_boot.QemuBootTest -v
      - name: boot it
        run: vm/test-boot.sh finnos.iso
      - name: look at the menu
        run: vm/menu-shot.sh finnos.iso /tmp/menu
      - name: the menu frames
        uses: actions/upload-artifact@v4
        with:
          name: boot-menu
          path: |
            /tmp/menu/frame-*.png
            /tmp/menu/frame-*.ppm
          if-no-files-found: warn
      - name: upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: finnos-iso
          path: finnos.iso

  install:
    name: install to a disk (opt-in)
    # The boot-to-installer check above runs on every build. This one is
    # opt-in because it pacstraps a base system and builds the compositor;
    # it verifies the installer's own final checks on the disk. Rebooting
    # the installed disk is the manual check, and a QEMU GPU is not the
    # OptiPlex's GPU, so it is not claimed here.
    needs: iso
    if: github.event_name == 'workflow_dispatch' && inputs.full_install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso qemu-system-x86
      - name: the ISO
        uses: actions/download-artifact@v4
        with:
          name: finnos-iso
      - name: install and check the disk
        env:
          FINNOS_ISO: finnos.iso
          FINNOS_FULL_INSTALL: '1'
          FINNOS_QEMU_TIMEOUT: '3600'
        run: python3 -m unittest tests.test_x86_boot.QemuFullInstallTest -v
