name: x86-64 UEFI boot smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - "boot/**"
      - "kernel/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/boot-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install boot test tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf mtools dosfstools
      - name: Run first-boot smoke test
        run: ./tools/finn test-boot
      - name: Run exception foundation test
        run: ./tools/finn test-exceptions
