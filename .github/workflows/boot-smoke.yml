name: UEFI boot smoke tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep this job id stable: branch protection requires the `smoke` check.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Install boot test tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf mtools dosfstools
      - name: Run first-boot smoke test
        run: ./tools/finn test-boot
      - name: Run release first-boot smoke test
        run: ./tools/finn test-boot --target x86_64-qemu --profile release
      - name: Run exception foundation test
        run: ./tools/finn test-exceptions
      - name: Run memory-map integration test
        run: ./tools/finn test-memory-map
      - name: Run physical page allocator integration test
        run: ./tools/finn test-page-allocator
      - name: Run page-table integration test
        run: ./tools/finn test-page-tables
      - name: Run heap integration test
        run: ./tools/finn test-heap
      - name: Run timer interrupt integration test
        run: ./tools/finn test-timer-interrupts
      - name: Run cooperative task integration test
        run: ./tools/finn test-cooperative-tasks
      - name: Preserve boot evidence on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: x86-64-boot-failure-${{ github.run_attempt }}
          path: build/out/
          if-no-files-found: warn
          retention-days: 14

  arm64-serial-first-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Install ARM64 boot test tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 mtools dosfstools
      - name: Run ARM64 serial first-boot smoke test
        run: ./tools/finn test-boot --target arm64-qemu
      - name: Run ARM64 memory-map and early allocator test
        run: ./tools/finn test-memory-map --target arm64-qemu
      - name: Run ARM64 owned page-table test
        run: ./tools/finn test-page-tables --target arm64-qemu
      - name: Run ARM64 GICv2 self-SGI test
        run: ./tools/finn test-arm64-gic --target arm64-qemu
      - name: Run ARM64 synchronous exception test
        run: ./tools/finn test-exceptions --target arm64-qemu
      - name: Run ARM64 fatal exception diagnostic test
        run: ./tools/finn test-arm64-exception-fatal --target arm64-qemu
      - name: Preserve ARM64 boot evidence on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arm64-serial-boot-failure-${{ github.run_attempt }}
          path: |
            build/out/arm64-qemu-test/
            build/out/arm64-qemu-memory-map/
            build/out/arm64-qemu-page-tables/
            build/out/arm64-qemu-arm64-gic/
            build/out/arm64-qemu-exceptions/
            build/out/arm64-qemu-arm64-exception-fatal/
          if-no-files-found: warn
          retention-days: 14
